[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-rubric"
version = "0.1.0"
description = "Rubric-conditioned neural Automated Essay Scoring with cross-prompt generalization (ASAP 2.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.45,<5",
    "accelerate>=0.34",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
