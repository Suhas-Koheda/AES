# Model A: TF-IDF + conventional classifier.
#
# No GPU required. Fits on the official training partition, selects `C` on the
# validation split by QWK, then evaluates once on the official test set.
inherits: _base.yaml

experiment:
  name: tfidf_baseline
  output_dir: results/01_tfidf_baseline
  protocol: official
  seed: 42

model:
  name: tfidf
  classifier: logreg
  analyzer: word
  ngram_range: [1, 2]
  max_features: 100000
  min_df: 2
  sublinear_tf: true
  class_weight: balanced
  max_iter: 3000
  C_grid: [0.25, 0.5, 1.0, 2.0, 4.0]
