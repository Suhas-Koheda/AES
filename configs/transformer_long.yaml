# Model B, long-context variant: 1024-token concatenation.
#
# Requires a GPU and more memory. Uses DeBERTa's relative position encoding
# beyond its nominal 512-token pretraining length; this is a documented
# extrapolation, not a guarantee.
inherits: transformer.yaml

experiment:
  name: transformer_qra_concat_long
  output_dir: results/02b_transformer_qra_concat_long

data:
  max_total_length: 1024
  max_context_length: 448
  max_answer_length: 573

train:
  batch_size: 8
  grad_accumulation: 2
  eval_batch_size: 16
